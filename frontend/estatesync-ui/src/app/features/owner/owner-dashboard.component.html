<app-dashboard-layout
  [title]="'Owner Dashboard'"
  [subtitle]="''"
  [navItems]="navItems()"
  [activeTab]="activeTab()"
  (tabChange)="setTab($event)">

  @if (activeTab() === 'overview') {
    <app-owner-overview-tab (tabSwitch)="setTab($event)" />
  }
  @if (activeTab() === 'properties') {
    <app-owner-properties-tab />
  }
  @if (activeTab() === 'applications') {
    <app-owner-applications-tab (pendingCountChange)="updateApplicationsBadge($event)" />
  }
  @if (activeTab() === 'leases') {
    <app-owner-leases-tab />
  }
  @if (activeTab() === 'complaints') {
    <app-owner-complaints-tab />
  }
  @if (activeTab() === 'visits') {
    <app-visits-tab [isOwnerView]="true" />
  }
  @if (activeTab() === 'earnings') {
    <app-owner-earnings-tab />
  }

</app-dashboard-layout>
