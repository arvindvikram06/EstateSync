<app-dashboard-layout
  [title]="'Verification Portal'"
  [subtitle]="''"
  [navItems]="navItems"
  [activeTab]="activeTab()"
  [topOffset]="0"
  [showLogout]="true"
  (tabChange)="setTab($event)"
  (logout)="onLogout()">

  @if (activeTab() === 'overview') {
    <app-verifier-overview-tab (tabSwitch)="setTab($event)" />
  }
  @if (activeTab() === 'kyc') {
    <app-admin-kyc-tab />
  }

</app-dashboard-layout>
