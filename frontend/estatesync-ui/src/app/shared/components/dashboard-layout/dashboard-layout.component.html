<div class="flex min-h-[calc(100vh-64px)]">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="w-60 shrink-0 bg-white border-r border-[#EBEBEB] flex flex-col sticky top-16 h-[calc(100vh-64px)] overflow-y-auto">
    <div class="px-5 pt-6 pb-5 border-b border-[#F0F0F0]">
      <div class="text-[15px] font-bold text-es-text leading-snug">{{ title() }}</div>
      @if (subtitle()) {
        <div class="text-xs text-es-muted mt-0.5 overflow-hidden text-ellipsis whitespace-nowrap">{{ subtitle() }}</div>
      }
    </div>

    <nav class="py-2.5 flex-1">
      @for (item of navItems(); track item.id) {
        <button
          class="dash-nav-btn flex items-center gap-3 w-full px-5 py-[11px] border-r-[3px] border-r-transparent border-t-0 border-b-0 border-l-0 bg-transparent cursor-pointer text-sm text-[#444] font-normal text-left transition-colors hover:bg-[#F7F7F7]"
          [class.dash-nav-item--active]="activeTab() === item.id"
          (click)="tabChange.emit(item.id)" type="button">
          <mat-icon class="dash-nav-icon text-es-muted shrink-0" style="font-size: 20px; width: 20px; height: 20px;">{{ item.icon }}</mat-icon>
          <span class="flex-1">{{ item.label }}</span>
          @if (item.badge) {
            <span class="bg-[var(--mat-sys-primary)] text-white rounded-[10px] px-1.5 py-px text-[11px] font-semibold min-w-[18px] text-center">{{ item.badge }}</span>
          }
        </button>
      }
    </nav>
  </aside>

  <!-- ── Main content ─────────────────────────────────────── -->
  <main class="flex-1 bg-[#F7F7F7] p-10 min-w-0 overflow-x-hidden">
    <ng-content />
  </main>

</div>
