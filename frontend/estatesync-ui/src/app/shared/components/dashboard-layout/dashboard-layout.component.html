<div class="relative md:flex" [style.minHeight]="'calc(100vh - ' + topOffset + 'px)'">

  <!-- ── Backdrop — mobile overlay only ──────────────────────── -->
  @if (sidebarOpen()) {
    <div class="sidebar-backdrop md:hidden" (click)="toggleSidebar()"
      [style.top.px]="topOffset"></div>
  }

  <!-- ── Sidebar ───────────────────────────────────────────────
       Mobile : position:fixed overlay, slides in from left
       Desktop: position:sticky in-flow, width expands/collapses
  ─────────────────────────────────────────────────────────────── -->
  <aside class="sidebar-panel" [class.sidebar-panel--open]="sidebarOpen()"
    [style.top.px]="topOffset"
    [style.height]="'calc(100vh - ' + topOffset + 'px)'">

    <div class="px-5 border-b border-es-border-light flex items-center"
         [style.height.px]="topOffset === 0 ? 56 : null"
         [class.py-5]="topOffset !== 0">
      @if (topOffset === 0) {
        <!-- Staff dashboards: logo — same 56px height as sticky top bar -->
        <a href="/" class="flex items-center gap-2 no-underline font-bold text-[18px] tracking-tight">
          <mat-icon class="text-brand !text-[22px] !w-[22px] !h-[22px]">home_work</mat-icon>
          <span class="text-brand">EstateSync</span>
        </a>
      } @else {
        <!-- User/owner dashboards: show dashboard title (logo is in top navbar) -->
        <div class="text-[15px] font-bold text-es-text leading-snug truncate">{{ title() }}</div>
        @if (subtitle()) {
          <div class="text-xs text-es-muted mt-0.5 truncate">{{ subtitle() }}</div>
        }
      }
    </div>

    <nav class="py-2.5 flex-1 overflow-y-auto">
      @for (item of navItems(); track item.id) {
        <button
          class="dash-nav-btn flex items-center gap-3 w-full px-5 py-[11px] border-r-[3px] border-r-transparent border-t-0 border-b-0 border-l-0 bg-transparent cursor-pointer text-sm text-es-soft font-normal text-left transition-colors hover:bg-es-bg"
          [class.dash-nav-item--active]="activeTab() === item.id"
          (click)="onNavClick(item.id)" type="button">
          <mat-icon class="dash-nav-icon text-es-muted shrink-0 !text-[20px] !w-[20px] !h-[20px]">{{ item.icon }}</mat-icon>
          <span class="flex-1">{{ item.label }}</span>
          @if (item.badge) {
            <span class="bg-[var(--mat-sys-primary)] text-white rounded-[10px] px-1.5 py-px text-[11px] font-semibold min-w-[18px] text-center">{{ item.badge }}</span>
          }
        </button>
      }
    </nav>

    @if (showLogout()) {
      <div class="border-t border-es-border-light p-3">
        <button
          class="flex items-center gap-3 w-full px-4 py-[10px] rounded-xl border-0 bg-transparent cursor-pointer text-sm text-es-danger font-medium text-left transition-colors hover:bg-es-danger-bg"
          (click)="logout.emit()" type="button">
          <mat-icon class="!text-[20px] !w-[20px] !h-[20px] text-es-danger">logout</mat-icon>
          Sign out
        </button>
      </div>
    }

  </aside>

  <!-- ── Main content ─────────────────────────────────────────── -->
  <main class="flex-1 bg-es-bg min-w-0" [style.minHeight]="'calc(100vh - ' + topOffset + 'px)'">

    <!-- Sticky top bar with hamburger (all screen sizes) -->
    <div class="sticky z-20 bg-white border-b border-es-border-light px-4 py-[10px] flex items-center gap-3" [style.top.px]="topOffset">
      <button mat-icon-button (click)="toggleSidebar()" aria-label="Toggle sidebar" class="shrink-0 !w-9 !h-9">
        <mat-icon class="!text-[22px] !w-[22px] !h-[22px] text-es-soft">menu</mat-icon>
      </button>
      <span class="text-[15px] font-semibold text-es-text leading-none">{{ title() }}</span>
      @if (subtitle()) {
        <span class="text-xs text-es-muted hidden sm:inline truncate">— {{ subtitle() }}</span>
      }
    </div>

    <!-- Page content -->
    <div class="p-4 md:p-10">
      <ng-content />
    </div>

  </main>

</div>
