apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estatesync-api-ingress
  namespace: estatesync
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - estatesync-api.southindia.cloudapp.azure.com
      secretName: estatesync-api-tls
  rules:
    - host: estatesync-api.southindia.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: estatesync-api-svc
                port:
                  number: 80
