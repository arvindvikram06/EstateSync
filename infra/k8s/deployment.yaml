apiVersion: apps/v1
kind: Deployment
metadata:
  name: estatesync-api
  namespace: estatesync
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: estatesync-api
  template:
    metadata:
      labels:
        app: estatesync-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: estatesync-api-sa
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: api
          image: estatesyncacr.azurecr.io/estatesync-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Azure__KeyVaultUri
              value: "https://estatesync-kv.vault.azure.net/"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
