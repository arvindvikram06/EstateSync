apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: estatesync
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: estatesync-api-sa
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: ai-service
          image: estatesyncacr.azurecr.io/estatesync-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: KEY_VAULT_URI
              value: "https://estatesync-kv.vault.azure.net/"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: estatesync
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
