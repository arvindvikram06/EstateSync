name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/estatesync-ui/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /frontend/estatesync-ui
          api_location: ''
          output_location: dist/estatesync-ui/browser
          app_build_command: npm run build -- --configuration production && cp dist/estatesync-ui/browser/index.csr.html dist/estatesync-ui/browser/index.html
