name: Deploy AI Service

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'infra/k8s/ai-service.yaml'
      - '.github/workflows/deploy-ai-service.yml'
  workflow_dispatch:

concurrency:
  group: production-ai-service
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      AKS_DEPLOY_KUBECONFIG: ${{ secrets.AKS_DEPLOY_KUBECONFIG }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Verify deployment configuration
        run: |
          missing=()
          for setting in ACR_LOGIN_SERVER ACR_USERNAME ACR_PASSWORD AKS_DEPLOY_KUBECONFIG; do
            if [ -z "${!setting}" ]; then
              missing+=("$setting")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required GitHub repository secrets: ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push AI service
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/estatesync-ai:$IMAGE_TAG" \
            -t "$ACR_LOGIN_SERVER/estatesync-ai:latest" \
            ai-service
          docker push "$ACR_LOGIN_SERVER/estatesync-ai:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/estatesync-ai:latest"

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure scoped Kubernetes access
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$AKS_DEPLOY_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply workloads
        run: |
          kubectl apply -f infra/k8s/ai-service.yaml
          kubectl set image deployment/ai-service \
            ai-service="$ACR_LOGIN_SERVER/estatesync-ai:$IMAGE_TAG" \
            -n estatesync
          kubectl rollout status deployment/ai-service -n estatesync --timeout=5m
